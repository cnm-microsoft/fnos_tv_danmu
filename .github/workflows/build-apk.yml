name: Build Debug APK

on:
  push:
    branches: [ master, master-*, feature/gsy-player ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info --warning-mode all 2>&1 | tee build.log

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== BUILD LOG ==="
          cat build.log
          echo "=== LAST 500 LINES ==="
          tail -n 500 build.log

      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          find app/build/outputs/apk/debug/ -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fnos-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
